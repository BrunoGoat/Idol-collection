name: App Android y Web

# Compila el APK y la versión web cada vez que cambia el código de la app.
# Los cambios solo en collection/ (tus ídolos) no disparan builds: la app los
# baja sola al abrirse.
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Clave de firma fija: se deriva siempre igual de la frase guardada en el
      # secret ANDROID_SIGNING_SEED, así cada APK se instala encima del anterior.
      # Sin el secret se firma con una clave de debug distinta en cada build.
      - name: Preparar clave de firma
        env:
          SIGNING_SEED: ${{ secrets.ANDROID_SIGNING_SEED }}
        if: env.SIGNING_SEED != ''
        run: |
          python3 -m venv /tmp/signing
          /tmp/signing/bin/pip install --quiet cryptography sympy
          /tmp/signing/bin/python android/tools/make_keystore.py android/app/idol-release.p12 android/key.properties

      - name: Compilar APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/salon-de-idolos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: salon-de-idolos-apk
          path: app/build/app/outputs/flutter-apk/salon-de-idolos.apk

      # Publica un Release: desde el teléfono entrás a
      # github.com/<usuario>/Idol-collection/releases/latest y bajás el APK.
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Salón de Ídolos 1.0.${{ github.run_number }}
          body: |
            APK compilado automáticamente desde la rama `${{ github.ref_name }}` (${{ github.sha }}).
            Bajá `salon-de-idolos.apk` desde el teléfono e instalalo, o actualizá desde la app.
          files: app/build/app/outputs/flutter-apk/salon-de-idolos.apk
          make_latest: true

  # Versión web para iPhone/Safari, publicada en GitHub Pages:
  # https://<usuario>.github.io/Idol-collection/
  web:
    runs-on: ubuntu-latest
    # Mientras GitHub Pages no esté activado (repo privado sin Pro), la
    # publicación falla: que eso no marque en rojo la compilación del APK.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      # El motor gráfico va incluido (sin CDN de Google) para que cargue igual
      # aunque algún bloqueador corte esos dominios.
      - name: Compilar web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --no-web-resources-cdn

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web
      - id: deploy
        uses: actions/deploy-pages@v4
